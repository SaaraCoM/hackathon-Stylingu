services:
  web:
    build: .
    image: stylingu:local
    env_file: backend/.env
    environment:
      NODE_ENV: production
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
