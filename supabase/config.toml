project_id = "stylingu-local"
[api]
port = 54321
schemas = ["public", "graphql_public"]
[db]
port = 54322
major_version = 17
[db.migrations]
enabled = false
[studio]
port = 54323
[inbucket]
port = 54324
[auth]
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080/api/auth/callback"]
jwt_expiry = 3600
minimum_password_length = 8
[auth.email]
enable_signup = true
enable_confirmations = true
[auth.email.template.confirmation]
subject = "Confirma tu cuenta StylingU"
content_path = "./supabase/templates/confirmation.html"
[auth.email.template.recovery]
subject = "Recupera tu cuenta StylingU"
content_path = "./supabase/templates/recovery.html"
[functions.before-user-created]
verify_jwt = false
