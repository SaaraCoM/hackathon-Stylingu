name: Deploy verified slot
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      image:
        required: true
        type: string
      release:
        required: true
        type: string
      bootstrap:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: stylingu-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      DOCKER_CONFIG: /dev/shm/stylingu-docker
      DEPLOY_ENV: ${{ inputs.target }}
      RELEASE_VERSION: ${{ inputs.release }}
      CONTAINER_IMAGE: ${{ inputs.image }}
      BOOTSTRAP: ${{ inputs.bootstrap }}
      PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
      PG_SSL_CA: ${{ vars.PG_SSL_CA }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      CF_SECRET_STORE_ID: ${{ vars.CF_SECRET_STORE_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      AUTH_HOOK_SECRET: ${{ secrets.AUTH_HOOK_SECRET }}
      SMOKE_FACE_PATH: ${{ vars.SMOKE_FACE_PATH }}
      SMOKE_BODY_PATH: ${{ vars.SMOKE_BODY_PATH }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ vars.SMTP_FROM }}
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - run: npm ci && npm ci --prefix backend
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9
        with:
          cosign-release: v3.1.4
      - run: node scripts/registry-login.mjs
      - run: cosign verify --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/ci.yml@refs/heads/main" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$CONTAINER_IMAGE"
      - run: cosign verify-attestation --type spdxjson --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/ci.yml@refs/heads/main" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$CONTAINER_IMAGE"
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.0.0
      - run: supabase functions deploy --help && supabase functions deploy before-user-created --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - run: node scripts/configure-auth.mjs
      - run: node scripts/migrate.mjs
      - id: slot
        run: node scripts/select-slot.mjs
      - run: node scripts/configure-container.mjs
        env:
          DEPLOY_SLOT: ${{ steps.slot.outputs.slot }}
      - run: npx wrangler deploy --config .wrangler/deploy/container.toml --containers-rollout=immediate
      - if: inputs.bootstrap
        run: |
          DEPLOY_SLOT=green node scripts/configure-container.mjs
          npx wrangler deploy --config .wrangler/deploy/container.toml --containers-rollout=immediate
          if [ "$DEPLOY_ENV" = staging ]; then
            npx wrangler deploy --env staging
            node -e 'process.stdout.write(process.env.OPS_TOKEN)' | npx wrangler secret put OPS_TOKEN --env staging
          else
            npx wrangler deploy --env=""
            node -e 'process.stdout.write(process.env.OPS_TOKEN)' | npx wrangler secret put OPS_TOKEN --env=""
          fi
      - run: node scripts/ops.mjs check
        env:
          DEPLOY_SLOT: ${{ steps.slot.outputs.slot }}
      - run: node scripts/remote-smoke.mjs
        env:
          DEPLOY_SLOT: ${{ steps.slot.outputs.slot }}
      - if: '!inputs.bootstrap'
        run: node scripts/ops.mjs promote
        env:
          DEPLOY_SLOT: ${{ steps.slot.outputs.slot }}
          EXPECTED_REVISION: ${{ steps.slot.outputs.revision }}
      - if: inputs.bootstrap
        run: |
          DEPLOY_SLOT=green node scripts/ops.mjs check
          DEPLOY_SLOT=green EXPECTED_REVISION=0 node scripts/ops.mjs promote
      - run: curl --fail --silent --show-error "$PUBLIC_ORIGIN/api/health" && curl --fail --silent --show-error "$PUBLIC_ORIGIN/api/ready"
      - if: always()
        run: rm -rf "$DOCKER_CONFIG"
