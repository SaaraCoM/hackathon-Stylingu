name: Rotate credentials
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rotate:
    strategy:
      fail-fast: false
      matrix:
        target: [staging, production]
    runs-on: ubuntu-latest
    environment: ${{ matrix.target }}-rotation
    concurrency:
      group: stylingu-${{ matrix.target }}
      cancel-in-progress: false
    env:
      DOCKER_CONFIG: /dev/shm/stylingu-docker
      DEPLOY_ENV: ${{ matrix.target }}
      PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
      PG_SSL_CA: ${{ vars.PG_SSL_CA }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      CF_SECRET_STORE_ID: ${{ vars.CF_SECRET_STORE_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_DEPLOY_TOKEN_POLICY_JSON: ${{ vars.CF_DEPLOY_TOKEN_POLICY_JSON }}
      CF_CURRENT_TOKEN_ID: ${{ vars.CF_CURRENT_TOKEN_ID }}
      SUPABASE_CURRENT_KEY_ID: ${{ vars.SUPABASE_CURRENT_KEY_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_ROTATION_TOKEN }}
      CF_ROTATION_TOKEN: ${{ secrets.CF_ROTATION_TOKEN }}
      SUPABASE_ROTATION_TOKEN: ${{ secrets.SUPABASE_ROTATION_TOKEN }}
      ROTATION_DATABASE_URL: ${{ secrets.ROTATION_DATABASE_URL }}
      ROTATION_GITHUB_TOKEN: ${{ secrets.ROTATION_GITHUB_TOKEN }}
      OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - run: npm ci && npm ci --prefix backend
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9
        with:
          cosign-release: v3.1.4
      - name: Read the deployed artifact; never build or update code during rotation
        run: |
          node scripts/ops.mjs status > current.json
          node -e 'const fs=require("fs"),s=JSON.parse(fs.readFileSync("current.json"));if(!s.image||s.release==="bootstrap")throw Error("Deployment bootstrap incomplete");fs.appendFileSync(process.env.GITHUB_ENV,"CONTAINER_IMAGE="+s.image+"\nRELEASE_VERSION="+s.release+"\nDEPLOY_SLOT="+(s.active==="blue"?"green":"blue")+"\n")'
      - run: node scripts/registry-login.mjs
      - run: cosign verify --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/ci.yml@refs/heads/main" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$CONTAINER_IMAGE"
      - run: node scripts/configure-container.mjs
      - run: npx wrangler deploy --config .wrangler/deploy/container.toml --containers-rollout=immediate
      - run: node scripts/security/rotate.mjs supabase
      - run: node scripts/security/rotate.mjs cloudflare
      - run: node scripts/security/rotate-database.mjs
      - if: always()
        run: rm -rf "$DOCKER_CONFIG"
